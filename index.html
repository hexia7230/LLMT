<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="LLMT Orchestrator — AI-driven Skyrim MOD XML localization pipeline with natural language interface.">
<title>LLMT Orchestrator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   DESIGN SYSTEM — LLMT Orchestrator v3.0
   ═══════════════════════════════════════════════════════════════════════ */
:root {
  --bg-root:     #0a0e17;
  --bg-surface:  #111827;
  --bg-elevated: #1a2236;
  --bg-input:    #0d1321;
  --border:      #1e293b;
  --border-focus:#3b82f6;
  --text-primary:#e2e8f0;
  --text-secondary:#94a3b8;
  --text-muted:  #64748b;
  --accent-blue: #3b82f6;
  --accent-blue-hover: #2563eb;
  --accent-cyan: #06b6d4;
  --accent-green:#22c55e;
  --accent-amber:#f59e0b;
  --accent-red:  #ef4444;
  --accent-purple:#a855f7;
  --phase1-color:#f59e0b;
  --phase2-color:#3b82f6;
  --phase3-color:#22c55e;
  --translating-color:#06b6d4;
  --glow-blue:   0 0 20px rgba(59,130,246,0.15);
  --glow-green:  0 0 20px rgba(34,197,94,0.15);
  --glow-amber:  0 0 20px rgba(245,158,11,0.15);
  --transition:  0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --font-sans:   'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono:   'JetBrains Mono', 'Consolas', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-sans);
  font-size: 14px;
  background: var(--bg-root);
  color: var(--text-primary);
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 24px 16px;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 800px 600px at 50% 0%, rgba(59,130,246,0.06), transparent),
    radial-gradient(ellipse 600px 400px at 80% 100%, rgba(168,85,247,0.04), transparent);
  pointer-events: none;
  z-index: 0;
}

#app {
  position: relative;
  z-index: 1;
  width: 640px;
  max-width: 100%;
}

/* ── Header ─────────────────────────────────────────────────────────── */
.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 16px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--border);
}

h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 3px;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 10px;
}
h1 .version-badge {
  font-size: 10px;
  font-weight: 500;
  color: var(--accent-blue);
  background: rgba(59,130,246,0.12);
  padding: 2px 8px;
  border-radius: 100px;
  letter-spacing: 1px;
}

/* ── Language Toggle ────────────────────────────────────────────────── */
#lang-toggle {
  display: flex;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  flex-shrink: 0;
}
#lang-toggle button {
  flex: none;
  padding: 6px 14px;
  font-size: 11px;
  font-weight: 600;
  font-family: var(--font-sans);
  cursor: pointer;
  border: none;
  background: var(--bg-elevated);
  color: var(--text-muted);
  letter-spacing: 1px;
  transition: all var(--transition);
}
#lang-toggle button.active {
  background: var(--accent-blue);
  color: #fff;
}
#lang-toggle button:not(.active):hover {
  background: var(--bg-surface);
  color: var(--text-secondary);
}

/* ── Sections ───────────────────────────────────────────────────────── */
.section { margin-bottom: 16px; }

label {
  display: block;
  margin-bottom: 6px;
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.5px;
}

/* ── Inputs ─────────────────────────────────────────────────────────── */
textarea.task-input,
input[type="text"] {
  width: 100%;
  padding: 12px 16px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 13px;
  border-radius: 10px;
  outline: none;
  transition: border-color var(--transition), box-shadow var(--transition);
  resize: vertical;
}
textarea.task-input { min-height: 80px; line-height: 1.6; }
textarea.task-input:focus,
input[type="text"]:focus {
  border-color: var(--accent-blue);
  box-shadow: var(--glow-blue);
}
textarea.task-input::placeholder,
input[type="text"]::placeholder {
  color: var(--text-muted);
  font-style: italic;
}

/* ── Info Grid ──────────────────────────────────────────────────────── */
.grid-info {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}
.info-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  transition: border-color var(--transition);
}
.info-card:hover { border-color: var(--border-focus); }
.info-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 6px;
}
.info-val {
  font-size: 20px;
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--accent-cyan);
}

/* ── Status Box ─────────────────────────────────────────────────────── */
.status-box {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-left: 4px solid var(--text-muted);
  border-radius: 10px;
  padding: 14px 18px;
  font-size: 13px;
  margin-bottom: 16px;
  min-height: 48px;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.status-box .status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--text-muted);
  flex-shrink: 0;
  transition: background var(--transition);
}
.status-box.phase1 { border-left-color: var(--phase1-color); box-shadow: var(--glow-amber); }
.status-box.phase1 .status-dot { background: var(--phase1-color); animation: pulse 1.5s infinite; }
.status-box.phase2 { border-left-color: var(--phase2-color); box-shadow: var(--glow-blue); }
.status-box.phase2 .status-dot { background: var(--phase2-color); animation: pulse 1.5s infinite; }
.status-box.phase3 { border-left-color: var(--phase3-color); box-shadow: var(--glow-green); }
.status-box.phase3 .status-dot { background: var(--phase3-color); animation: pulse 1.5s infinite; }
.status-box.translating { border-left-color: var(--translating-color); }
.status-box.translating .status-dot { background: var(--translating-color); animation: pulse 1.5s infinite; }
.status-box.done { border-left-color: var(--accent-green); }
.status-box.done .status-dot { background: var(--accent-green); }
.status-box.error { border-left-color: var(--accent-red); }
.status-box.error .status-dot { background: var(--accent-red); }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ── Context Panel (Phase 2 Dialog) ────────────────────────────────── */
.context-panel {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 16px;
  overflow: hidden;
  display: none;
}
.context-panel.visible { display: block; }
.context-panel-header {
  padding: 12px 18px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-secondary);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}
.context-panel-header .step-indicator {
  color: var(--accent-blue);
  font-family: var(--font-mono);
}
.context-chat {
  max-height: 300px;
  overflow-y: auto;
  padding: 16px;
}
.chat-bubble {
  margin-bottom: 12px;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 13px;
  line-height: 1.5;
  max-width: 90%;
  animation: fadeSlideUp 0.25s ease-out;
}
@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.chat-bubble.system {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  margin-right: auto;
}
.chat-bubble.user {
  background: rgba(59,130,246,0.12);
  border: 1px solid rgba(59,130,246,0.2);
  color: var(--text-primary);
  margin-left: auto;
  text-align: right;
}
.context-options {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 0 16px 16px;
}
.context-option-btn {
  padding: 8px 18px;
  font-size: 12px;
  font-weight: 600;
  font-family: var(--font-sans);
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-elevated);
  color: var(--text-primary);
  cursor: pointer;
  transition: all var(--transition);
}
.context-option-btn:hover {
  background: var(--accent-blue);
  color: #fff;
  border-color: var(--accent-blue);
  transform: translateY(-1px);
}
.context-free-input {
  display: flex;
  gap: 8px;
  padding: 0 16px 16px;
}
.context-free-input input {
  flex: 1;
  padding: 10px 14px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 12px;
  border-radius: 8px;
  outline: none;
}
.context-free-input input:focus { border-color: var(--accent-blue); }
.context-free-input button {
  padding: 10px 20px;
  background: var(--accent-blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  font-family: var(--font-sans);
  cursor: pointer;
  transition: background var(--transition);
}
.context-free-input button:hover { background: var(--accent-blue-hover); }

/* ── Dump Ready Card (Phase 3 summary) ─────────────────────────────── */
.dump-card {
  background: var(--bg-surface);
  border: 1px solid rgba(34,197,94,0.25);
  border-radius: 10px;
  margin-bottom: 16px;
  overflow: hidden;
  display: none;
}
.dump-card.visible { display: block; animation: fadeSlideUp 0.3s ease-out; }
.dump-card-header {
  background: rgba(34,197,94,0.08);
  padding: 12px 18px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--accent-green);
  border-bottom: 1px solid rgba(34,197,94,0.15);
  display: flex;
  align-items: center;
  gap: 8px;
}
.dump-card-body {
  padding: 14px 18px;
}
.dump-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
}
.dump-row:last-child { border-bottom: none; }
.dump-key   { color: var(--text-secondary); }
.dump-value { color: var(--accent-cyan); font-family: var(--font-mono); font-size: 12px; font-weight: 500; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }

/* ── Buttons ────────────────────────────────────────────────────────── */
.actions {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}

button.action-btn {
  flex: 1;
  padding: 12px;
  font-size: 13px;
  font-weight: 600;
  font-family: var(--font-sans);
  cursor: pointer;
  border: none;
  border-radius: 10px;
  transition: all var(--transition);
  letter-spacing: 0.5px;
}

#btn-submit {
  background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%);
  color: #fff;
}
#btn-submit:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(59,130,246,0.3);
}
#btn-submit:disabled {
  background: var(--bg-elevated);
  color: var(--text-muted);
  cursor: not-allowed;
}

#btn-start-translation {
  background: linear-gradient(135deg, var(--accent-green) 0%, #16a34a 100%);
  color: #fff;
  flex: 1;
  display: none;
}
#btn-start-translation.visible { display: block; }
#btn-start-translation:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(34,197,94,0.3);
}

#btn-stop {
  background: var(--accent-red);
  color: #fff;
  flex: 0.5;
}
#btn-stop:hover:not(:disabled) { background: #dc2626; }
#btn-stop:disabled {
  background: var(--bg-elevated);
  color: var(--text-muted);
  cursor: not-allowed;
}

#btn-reset {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  flex: 0.5;
}
#btn-reset:hover:not(:disabled) {
  background: var(--bg-surface);
  color: var(--text-primary);
  border-color: var(--text-muted);
}

/* ── Progress Bar ───────────────────────────────────────────────────── */
.progress-bar-container {
  width: 100%;
  height: 4px;
  background: var(--bg-elevated);
  border-radius: 2px;
  margin-bottom: 16px;
  overflow: hidden;
  display: none;
}
.progress-bar-container.visible { display: block; }
.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan));
  border-radius: 2px;
  width: 0%;
  transition: width 0.4s ease;
}

/* ── Log ────────────────────────────────────────────────────────────── */
.log-container { width: 100%; }
.log-container textarea {
  width: 100%;
  height: 200px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: #6ee7b7;
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 14px;
  resize: vertical;
  outline: none;
  border-radius: 10px;
  line-height: 1.6;
}

/* ── Responsive ─────────────────────────────────────────────────────── */
@media (max-width: 680px) {
  #app { width: 100%; }
  .context-options { flex-direction: column; }
  .actions { flex-wrap: wrap; }
}
</style>
</head>
<body>

<div id="app">
  <!-- Header -->
  <div class="header-row">
    <h1>LLMT ORCHESTRATOR <span class="version-badge">v3.0</span></h1>
    <div id="lang-toggle">
      <button id="btn-lang-ja" class="active" onclick="setLang('ja')">JA</button>
      <button id="btn-lang-en" onclick="setLang('en')">EN</button>
    </div>
  </div>

  <!-- Task Input -->
  <div class="section">
    <label id="label-task">タスク入力</label>
    <textarea class="task-input" id="task-input"
      placeholder="例：C:\path\to\file.xml を翻訳して" rows="3"></textarea>
  </div>

  <!-- WordWall Info -->
  <div class="grid-info">
    <div class="info-card">
      <div class="info-label" id="label-ww-files">WordWall 参照ファイル</div>
      <div id="ww-file-count" class="info-val">-</div>
    </div>
    <div class="info-card">
      <div class="info-label" id="label-ww-terms">参照語数</div>
      <div id="ww-term-count" class="info-val">-</div>
    </div>
  </div>

  <!-- Status -->
  <div id="status-display" class="status-box">
    <div class="status-dot"></div>
    <span id="status-prefix">状態:</span>&nbsp;<span id="status-message">待機中</span>
  </div>

  <!-- Progress Bar -->
  <div class="progress-bar-container" id="progress-container">
    <div class="progress-bar" id="progress-bar"></div>
  </div>

  <!-- Context Panel (Phase 2 Dialog) -->
  <div class="context-panel" id="context-panel">
    <div class="context-panel-header">
      <span id="context-header-text">翻訳設定</span>
      <span class="step-indicator" id="step-indicator"></span>
    </div>
    <div class="context-chat" id="context-chat"></div>
    <div class="context-options" id="context-options"></div>
    <div class="context-free-input" id="context-free-input" style="display:none;">
      <input type="text" id="free-input" placeholder="入力してください...">
      <button onclick="submitFreeInput()" id="btn-free-send">送信</button>
    </div>
  </div>

  <!-- Dump Ready Card (Phase 3) -->
  <div class="dump-card" id="dump-card">
    <div class="dump-card-header">
      <span>✓ DUMP_READY — translation_dump.json</span>
    </div>
    <div class="dump-card-body" id="dump-card-body"></div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="action-btn" id="btn-submit" onclick="submitTask()">送信</button>
    <button class="action-btn" id="btn-start-translation" onclick="startFromDump()">翻訳開始</button>
    <button class="action-btn" id="btn-stop" onclick="stopTask()" disabled>停止</button>
    <button class="action-btn" id="btn-reset" onclick="resetSession()">リセット</button>
  </div>

  <!-- Log Console -->
  <div class="log-container">
    <label id="label-log">コンソールログ</label>
    <textarea id="log" readonly></textarea>
  </div>
</div>

<script>
const BASE = window.location.origin;
let currentLang = "ja";

// ══════════════════════════════════════════════════════════════════════════════
//  LOCALIZATION
// ══════════════════════════════════════════════════════════════════════════════
const STRINGS = {
  ja: {
    labelTask:       "タスク入力",
    taskPlaceholder: "例：C:\\path\\to\\file.xml を翻訳して",
    labelWwFiles:    "WordWall 参照ファイル",
    labelWwTerms:    "参照語数",
    statusPrefix:    "状態:",
    labelLog:        "コンソールログ",
    btnSubmit:       "送信",
    btnStartTrans:   "翻訳開始",
    btnStop:         "停止",
    btnReset:        "リセット",
    contextHeader:   "翻訳設定",
    sendLabel:       "送信",
    inputPlaceholder:"ファイルパスを入力してください...",
    idle:            "待機中",
    phase1:          (intent) => `[Phase 1] Intent: ${intent}`,
    phase2:          "翻訳設定を収集中...",
    phase3:          "DUMP_READY — 翻訳設定完了",
    translating:     (msg, pct, eta) => `${msg} (${pct}% | 残り ${eta})`,
    done:            (msg) => msg,
    needPrompt:      "翻訳タスクを入力してください（例：C:\\path\\to\\file.xml を翻訳して）",
    stopped:         "停止しました。",
    resetDone:       "セッションをリセットしました。",
    intentTranslate: "翻訳",
    intentQuery:     "クエリ",
    xmlDetected:     (p) => `[Phase 1] XMLパス検出: ${p}`,
    dumpReady:       "DUMP_READY — 翻訳ダンプを生成しました",
    startJob:        (p) => `翻訳ジョブを開始しました: ${p}`,
    styleLabel:      { game: "ゲーム公式", formal: "フォーマル", casual: "カジュアル" },
  },
  en: {
    labelTask:       "Task Input",
    taskPlaceholder: "e.g. Translate C:\\path\\to\\file.xml",
    labelWwFiles:    "WordWall Reference Files",
    labelWwTerms:    "Reference Terms",
    statusPrefix:    "Status:",
    labelLog:        "Console Log",
    btnSubmit:       "Submit",
    btnStartTrans:   "Start Translation",
    btnStop:         "Stop",
    btnReset:        "Reset",
    contextHeader:   "Translation Settings",
    sendLabel:       "Send",
    inputPlaceholder:"Enter file path...",
    idle:            "Idle",
    phase1:          (intent) => `[Phase 1] Intent: ${intent}`,
    phase2:          "Gathering translation settings...",
    phase3:          "DUMP_READY — settings complete",
    translating:     (msg, pct, eta) => `${msg} (${pct}% | ETA ${eta})`,
    done:            (msg) => msg,
    needPrompt:      "Enter a translation task (e.g. Translate C:\\path\\to\\file.xml)",
    stopped:         "Stopped.",
    resetDone:       "Session reset.",
    intentTranslate: "translate",
    intentQuery:     "query",
    xmlDetected:     (p) => `[Phase 1] XML path detected: ${p}`,
    dumpReady:       "DUMP_READY — translation dump generated",
    startJob:        (p) => `Translation job started: ${p}`,
    styleLabel:      { game: "Game Official", formal: "Formal", casual: "Casual" },
  }
};

function t() { return STRINGS[currentLang]; }

function setLang(lang) {
  currentLang = lang;
  document.getElementById("btn-lang-ja").classList.toggle("active", lang === "ja");
  document.getElementById("btn-lang-en").classList.toggle("active", lang === "en");
  applyLang();
}

function applyLang() {
  const s = t();
  document.getElementById("label-task").textContent        = s.labelTask;
  document.getElementById("task-input").placeholder        = s.taskPlaceholder;
  document.getElementById("label-ww-files").textContent    = s.labelWwFiles;
  document.getElementById("label-ww-terms").textContent    = s.labelWwTerms;
  document.getElementById("status-prefix").textContent     = s.statusPrefix;
  document.getElementById("label-log").textContent         = s.labelLog;
  document.getElementById("btn-submit").textContent        = s.btnSubmit;
  document.getElementById("btn-start-translation").textContent = s.btnStartTrans;
  document.getElementById("btn-stop").textContent          = s.btnStop;
  document.getElementById("btn-reset").textContent         = s.btnReset;
  document.getElementById("context-header-text").textContent  = s.contextHeader;
  document.getElementById("btn-free-send").textContent     = s.sendLabel;
  document.getElementById("free-input").placeholder        = s.inputPlaceholder;
}

// ══════════════════════════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════════════════════════
document.addEventListener("DOMContentLoaded", () => {
  applyLang();
  loadWordWallInfo();

  document.getElementById("task-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      submitTask();
    }
  });
  document.getElementById("free-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); submitFreeInput(); }
  });

  setInterval(pollStatus, 800);
  pollStatus();
});

// ══════════════════════════════════════════════════════════════════════════════
//  WORDWALL INFO
// ══════════════════════════════════════════════════════════════════════════════
function loadWordWallInfo() {
  fetch(BASE + "/api/wordwall_info")
    .then(r => r.json())
    .then(d => {
      if (d.ok) {
        document.getElementById("ww-file-count").textContent = d.file_count;
        document.getElementById("ww-term-count").textContent = d.vocab_terms.toLocaleString();
        d.files.forEach(f => appendLog(`[WordWall] ${f.filename} (${f.entry_count} entries)`));
      }
    })
    .catch(e => console.error("WordWall info failed:", e));
}

// ══════════════════════════════════════════════════════════════════════════════
//  STATUS POLLING
// ══════════════════════════════════════════════════════════════════════════════
function pollStatus() {
  fetch(BASE + "/api/status")
    .then(r => r.json())
    .then(s => updateStatusUI(s))
    .catch(e => console.error("Status poll failed:", e));
}

function updateStatusUI(s) {
  const box     = document.getElementById("status-display");
  const msgEl   = document.getElementById("status-message");
  const btnStop = document.getElementById("btn-stop");
  const pc      = document.getElementById("progress-container");
  const pb      = document.getElementById("progress-bar");

  box.className = "status-box";
  let pct = s.total > 0 ? Math.round((s.progress / s.total) * 100) : 0;
  const phase = s.session_phase || s.phase || "idle";

  if (phase === "phase1") {
    box.classList.add("phase1");
    msgEl.textContent = s.message || t().phase1(s.session_intent || "");
    btnStop.disabled = true;
  } else if (phase === "phase2") {
    box.classList.add("phase2");
    msgEl.textContent = s.message || t().phase2;
    btnStop.disabled = true;
  } else if (phase === "phase3") {
    box.classList.add("phase3");
    msgEl.textContent = s.message || t().phase3;
    btnStop.disabled = true;
  } else if (s.status === "loading" || s.status === "translating") {
    box.classList.add("translating");
    msgEl.textContent = t().translating(s.message, pct, s.eta || "--");
    btnStop.disabled = false;
    pc.classList.add("visible");
    pb.style.width = pct + "%";
  } else if (s.status === "done") {
    box.classList.add("done");
    msgEl.textContent = t().done(s.message);
    btnStop.disabled = true;
    pc.classList.remove("visible");
  } else {
    msgEl.textContent = s.message || t().idle;
    btnStop.disabled = true;
    pc.classList.remove("visible");
  }
}

// ══════════════════════════════════════════════════════════════════════════════
//  PHASE 1 — SUBMIT TASK
// ══════════════════════════════════════════════════════════════════════════════
function submitTask() {
  const prompt = document.getElementById("task-input").value.trim();
  if (!prompt) { appendLog(t().needPrompt); return; }

  document.getElementById("btn-submit").disabled = true;
  hideContextPanel();
  hideDumpCard();
  document.getElementById("btn-start-translation").classList.remove("visible");
  document.getElementById("btn-start-translation").style.display = "none";

  appendLog(`[submit] ${prompt.substring(0, 80)}${prompt.length > 80 ? "..." : ""}`);

  fetch(BASE + "/api/classify", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({prompt, lang: currentLang})
  })
  .then(r => r.json())
  .then(d => {
    if (!d.ok) {
      appendLog(`[ERROR] ${d.error}`);
      document.getElementById("btn-submit").disabled = false;
      return;
    }

    const intentLabel = d.intent === "translate" ? t().intentTranslate : t().intentQuery;
    appendLog(t().phase1(intentLabel));

    if (d.xml_path_detected) {
      appendLog(t().xmlDetected(d.xml_path_detected));
    }

    if (d.action === "gather_context" && d.question) {
      showContextPanel();
      addChatBubble("system", d.question.text);
      renderQuestionOptions(d.question);
    } else {
      // query — not a translation task
      appendLog(`[phase1] ${d.message}`);
      document.getElementById("btn-submit").disabled = false;
    }
  })
  .catch(e => {
    appendLog(`[ERROR] ${e}`);
    document.getElementById("btn-submit").disabled = false;
  });
}

// ══════════════════════════════════════════════════════════════════════════════
//  PHASE 2 — CONTEXT DIALOG
// ══════════════════════════════════════════════════════════════════════════════
function showContextPanel() {
  document.getElementById("context-panel").classList.add("visible");
}
function hideContextPanel() {
  document.getElementById("context-panel").classList.remove("visible");
  document.getElementById("context-chat").innerHTML = "";
  document.getElementById("context-options").innerHTML = "";
  document.getElementById("context-free-input").style.display = "none";
}

function addChatBubble(role, text) {
  const chat   = document.getElementById("context-chat");
  const bubble = document.createElement("div");
  bubble.className = `chat-bubble ${role}`;
  bubble.textContent = text;
  chat.appendChild(bubble);
  chat.scrollTop = chat.scrollHeight;
}

function renderQuestionOptions(question) {
  const optDiv  = document.getElementById("context-options");
  const freeDiv = document.getElementById("context-free-input");
  optDiv.innerHTML = "";
  freeDiv.style.display = "none";

  document.getElementById("step-indicator").textContent =
    `${question.index + 1} / ${question.total}`;

  if (question.options) {
    question.options.forEach((opt, i) => {
      const btn = document.createElement("button");
      btn.className = "context-option-btn";
      btn.textContent = opt;
      btn.onclick = () => submitContextAnswer(opt, i);
      optDiv.appendChild(btn);
    });
  } else {
    freeDiv.style.display = "flex";
    document.getElementById("free-input").value = "";
    document.getElementById("free-input").focus();
  }
}

function submitContextAnswer(answer, optionIndex = null) {
  addChatBubble("user", answer);
  document.getElementById("context-options").innerHTML = "";
  document.getElementById("context-free-input").style.display = "none";

  fetch(BASE + "/api/respond", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({answer, option_index: optionIndex, lang: currentLang})
  })
  .then(r => r.json())
  .then(d => {
    if (!d.ok) { appendLog(`[ERROR] ${d.error}`); return; }

    if (d.action === "next_question") {
      addChatBubble("system", d.question.text);
      renderQuestionOptions(d.question);

    } else if (d.action === "dump_ready") {
      // ── Phase 3 complete: DUMP_READY ────────────────────────────────────
      appendLog(t().dumpReady);
      appendLog(`[phase3] DUMP_READY`);
      hideContextPanel();
      showDumpCard(d.summary);
      document.getElementById("btn-start-translation").classList.add("visible");
      document.getElementById("btn-start-translation").style.display = "block";
      document.getElementById("btn-submit").disabled = false;
    }
  })
  .catch(e => appendLog(`[ERROR] ${e}`));
}

function submitFreeInput() {
  const input = document.getElementById("free-input");
  const val   = input.value.trim();
  if (!val) return;
  submitContextAnswer(val, null);
}

// ══════════════════════════════════════════════════════════════════════════════
//  DUMP READY CARD (Phase 3)
// ══════════════════════════════════════════════════════════════════════════════
function showDumpCard(summary) {
  const card = document.getElementById("dump-card");
  const body = document.getElementById("dump-card-body");
  const s    = t();
  body.innerHTML = "";

  const styleStr = s.styleLabel[summary.style] || summary.style;
  const rows = [
    ["XML ファイル", summary.xml_path],
    ["翻訳スタイル", styleStr],
    ["WordWall辞書", summary.use_wordwall  ? "使用" : "未使用"],
    ["翻訳済みスキップ", summary.skip_translated ? "あり" : "なし"],
  ];
  rows.forEach(([key, val]) => {
    const row = document.createElement("div");
    row.className = "dump-row";
    row.innerHTML = `<span class="dump-key">${key}</span><span class="dump-value" title="${val}">${val}</span>`;
    body.appendChild(row);
  });
  card.classList.add("visible");
}
function hideDumpCard() {
  document.getElementById("dump-card").classList.remove("visible");
}

// ══════════════════════════════════════════════════════════════════════════════
//  START TRANSLATION (Phase 3 → 4)
// ══════════════════════════════════════════════════════════════════════════════
function startFromDump() {
  document.getElementById("btn-start-translation").disabled = true;

  fetch(BASE + "/api/start_translation", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
  })
  .then(r => r.json())
  .then(d => {
    if (!d.ok) {
      appendLog(`[ERROR] ${d.error}`);
      document.getElementById("btn-start-translation").disabled = false;
      return;
    }
    appendLog(t().startJob(d.xml_path));
    document.getElementById("btn-start-translation").classList.remove("visible");
    document.getElementById("btn-start-translation").style.display = "none";
  })
  .catch(e => {
    appendLog(`[ERROR] ${e}`);
    document.getElementById("btn-start-translation").disabled = false;
  });
}

// ══════════════════════════════════════════════════════════════════════════════
//  STOP / RESET
// ══════════════════════════════════════════════════════════════════════════════
function stopTask() {
  fetch(BASE + "/api/stop", {method: "POST"})
    .then(r => r.json())
    .then(d => { if (d.ok) appendLog(t().stopped); });
}

function resetSession() {
  fetch(BASE + "/api/reset", {method: "POST"})
    .then(r => r.json())
    .then(d => {
      if (d.ok) {
        appendLog(t().resetDone);
        hideContextPanel();
        hideDumpCard();
        document.getElementById("btn-submit").disabled = false;
        document.getElementById("btn-start-translation").style.display = "none";
        document.getElementById("btn-start-translation").classList.remove("visible");
        document.getElementById("task-input").value = "";
      }
    });
}

// ══════════════════════════════════════════════════════════════════════════════
//  LOG
// ══════════════════════════════════════════════════════════════════════════════
function appendLog(text) {
  const log = document.getElementById("log");
  const ts  = new Date().toLocaleTimeString();
  log.textContent += `[${ts}] ${text}\n`;
  log.scrollTop = log.scrollHeight;
}
</script>
</body>
</html>
