<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>LLM-Translator</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "MS UI Gothic", "MS Gothic", "Yu Gothic", Meiryo, monospace;
  font-size: 13px;
  background: #1e1e1e;
  color: #d4d4d4;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 32px 16px;
}

#app {
  width: 560px;
  max-width: 100%;
}

.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #444;
  padding-bottom: 8px;
  margin-bottom: 24px;
}

h1 {
  font-size: 16px;
  font-weight: bold;
  letter-spacing: 2px;
  color: #c8c8c8;
}

/* Language Toggle */
#lang-toggle {
  display: flex;
  border: 1px solid #444;
  border-radius: 2px;
  overflow: hidden;
  flex-shrink: 0;
}

#lang-toggle button {
  flex: none;
  padding: 4px 10px;
  font-size: 11px;
  font-weight: bold;
  cursor: pointer;
  border: none;
  border-radius: 0;
  background: #2d2d2d;
  color: #858585;
  letter-spacing: 1px;
  transition: background 0.15s, color 0.15s;
}

#lang-toggle button.active {
  background: #007acc;
  color: #fff;
}

#lang-toggle button:not(.active):hover {
  background: #3c3c3c;
  color: #c8c8c8;
}

.section {
  margin-bottom: 20px;
}

label {
  display: block;
  margin-bottom: 4px;
  color: #9e9e9e;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

input[type="text"] {
  width: 100%;
  padding: 8px 12px;
  background: #252526;
  border: 1px solid #3c3c3c;
  color: #fff;
  font-family: monospace;
  font-size: 12px;
  border-radius: 2px;
  outline: none;
}
input[type="text"]:focus {
  border-color: #007acc;
}

.grid-info {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  background: #252526;
  padding: 12px;
  border: 1px solid #2d2d2d;
  margin-bottom: 20px;
}
.info-item {
  display: flex;
  flex-direction: column;
}
.info-label {
  font-size: 10px;
  color: #858585;
  margin-bottom: 2px;
}
.info-val {
  font-size: 14px;
  font-family: monospace;
  font-weight: bold;
}

.status-box {
  background: #2d2d2d;
  border-left: 4px solid #555;
  padding: 12px;
  font-size: 13px;
  margin-bottom: 24px;
  min-height: 44px;
  display: flex;
  align-items: center;
}

.actions {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
}

button {
  flex: 1;
  padding: 10px;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  border: none;
  border-radius: 2px;
  transition: background 0.2s;
}

#btn-start { background: #0e639c; color: #fff; }
#btn-start:hover:not(:disabled) { background: #1177bb; }
#btn-start:disabled { background: #3c3c3c; color: #777; cursor: not-allowed; }

#btn-stop { background: #a61c1c; color: #fff; }
#btn-stop:hover:not(:disabled) { background: #cd2323; }
#btn-stop:disabled { background: #3c3c3c; color: #777; cursor: not-allowed; }

.log-container {
  width: 100%;
}
textarea {
  width: 100%;
  height: 220px;
  background: #1e1e1e;
  border: 1px solid #3c3c3c;
  color: #859900;
  font-family: monospace;
  font-size: 12px;
  padding: 12px;
  resize: vertical;
  outline: none;
}
</style>
</head>
<body>

<div id="app">
  <div class="header-row">
    <h1>LLM-TRANSLATOR v1.0</h1>
    <div id="lang-toggle">
      <button id="btn-lang-ja" class="active" onclick="setLang('ja')">JA</button>
      <button id="btn-lang-en" onclick="setLang('en')">EN</button>
    </div>
  </div>

  <div class="section">
    <label id="label-path" for="xml-path">SST XML ファイルパス</label>
    <input type="text" id="xml-path" placeholder="C:\path\to\your\file.xml" oninput="cleanInputPath(this)" onblur="cleanInputPath(this)">
  </div>

  <div class="grid-info">
    <div class="info-item">
      <div class="info-label" id="label-filename">ファイル名</div>
      <div id="file-name" class="info-val">-</div>
    </div>
    <div class="info-item">
      <div class="info-label" id="label-entries">対象文字列数</div>
      <div id="entry-count" class="info-val">-</div>
    </div>
  </div>

  <div id="status-display" class="status-box">
    <span id="status-prefix">状態:</span>&nbsp;<span id="status-message">待機中</span>
  </div>

  <div class="actions">
    <button id="btn-start" onclick="startTranslation()" disabled>開始</button>
    <button id="btn-stop" onclick="stopTranslation()" disabled>停止</button>
  </div>

  <div class="log-container">
    <label id="label-log">コンソールログ</label>
    <textarea id="log" readonly></textarea>
  </div>
</div>

<script>
const BASE = window.location.origin;
let xmlReady = false;
let currentPath = "";
let currentLang = "ja";

// ── Translations ──────────────────────────────────────────────────────────────
const STRINGS = {
  ja: {
    labelPath:    "SST XML ファイルパス",
    placeholder:  "C:\\path\\to\\your\\file.xml",
    labelFilename:"ファイル名",
    labelEntries: "対象文字列数",
    statusPrefix: "状態:",
    labelLog:     "コンソールログ",
    btnStart:     "開始",
    btnStop:      "停止",
    idle:         "待機中",
    loading:      "モデルをロード中...",
    done:         "完了",
    statusLoading:(msg, pct, eta) => `${msg} (${pct}% | 残り ${eta})`,
    statusTranslating:(msg, pct, eta) => `${msg} (${pct}% | 残り ${eta})`,
    statusDone:   (msg) => msg,
    statusIdle:   (msg) => msg,
    xmlOk:        (count, fname) => `XML 確認 OK: ${count} エントリー (${fname})`,
    xmlError:     (err) => `ERROR: ${err}`,
    jobSent:      (path) => `翻訳ジョブを送信しました: ${path}`,
    needPath:     "XML パスを指定してください",
    stopped:      "翻訳を強制停止しました。",
  },
  en: {
    labelPath:    "SST XML File Path",
    placeholder:  "C:\\path\\to\\your\\file.xml",
    labelFilename:"File Name",
    labelEntries: "Target Strings",
    statusPrefix: "Status:",
    labelLog:     "Console Log",
    btnStart:     "Start",
    btnStop:      "Stop",
    idle:         "Idle",
    loading:      "Loading model...",
    done:         "Done",
    statusLoading:(msg, pct, eta) => `${msg} (${pct}% | ETA ${eta})`,
    statusTranslating:(msg, pct, eta) => `${msg} (${pct}% | ETA ${eta})`,
    statusDone:   (msg) => msg,
    statusIdle:   (msg) => msg,
    xmlOk:        (count, fname) => `XML OK: ${count} entries (${fname})`,
    xmlError:     (err) => `ERROR: ${err}`,
    jobSent:      (path) => `Translation job submitted: ${path}`,
    needPath:     "Please specify an XML path",
    stopped:      "Translation stopped.",
  }
};

function t() { return STRINGS[currentLang]; }

function setLang(lang) {
  currentLang = lang;
  document.getElementById("btn-lang-ja").classList.toggle("active", lang === "ja");
  document.getElementById("btn-lang-en").classList.toggle("active", lang === "en");
  applyLang();
}

function applyLang() {
  const s = t();
  document.getElementById("label-path").textContent    = s.labelPath;
  document.getElementById("xml-path").placeholder      = s.placeholder;
  document.getElementById("label-filename").textContent = s.labelFilename;
  document.getElementById("label-entries").textContent  = s.labelEntries;
  document.getElementById("status-prefix").textContent  = s.statusPrefix;
  document.getElementById("label-log").textContent      = s.labelLog;
  document.getElementById("btn-start").textContent      = s.btnStart;
  document.getElementById("btn-stop").textContent       = s.btnStop;
}

// ── Input Cleaner ─────────────────────────────────────────────────────────────
function cleanInputPath(inputEl) {
  let p = inputEl.value;
  let cleaned = p.trim().replace(/^["']|["']$/g, "").replace(/"/g, "").replace(/'/g, "");
  if (p !== cleaned) {
    inputEl.value = cleaned;
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", () => {
  applyLang();
  const pathInput = document.getElementById("xml-path");

  let timer;
  pathInput.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(() => { checkXML(); }, 500);
  });

  setInterval(pollStatus, 800);
  pollStatus();
});

// ── Status polling ────────────────────────────────────────────────────────────
function pollStatus() {
  fetch(BASE + "/api/status")
    .then(r => r.json())
    .then(s => updateUI(s))
    .catch(e => console.error("Status polling failed:", e));
}

function updateUI(s) {
  const display   = document.getElementById("status-display");
  const msgEl     = document.getElementById("status-message");
  const btnStart  = document.getElementById("btn-start");
  const btnStop   = document.getElementById("btn-stop");
  const lang      = t();

  let pct = 0;
  if (s.total > 0) {
    pct = Math.round((s.progress / s.total) * 100);
  }

  if (s.status === "loading") {
    msgEl.textContent = lang.statusLoading(s.message, pct, s.eta || "--");
    display.style.borderLeftColor = "#f1c40f";
    btnStart.disabled = true;
    btnStop.disabled = false;
  } else if (s.status === "translating") {
    msgEl.textContent = lang.statusTranslating(s.message, pct, s.eta || "--");
    display.style.borderLeftColor = "#3498db";
    btnStart.disabled = true;
    btnStop.disabled = false;
  } else if (s.status === "done") {
    msgEl.textContent = lang.statusDone(s.message);
    display.style.borderLeftColor = "#2ecc71";
    btnStart.disabled = !xmlReady;
    btnStop.disabled = true;
  } else {
    // idle or error
    msgEl.textContent = lang.statusIdle(s.message);
    display.style.borderLeftColor = "#555";
    btnStart.disabled = !xmlReady;
    btnStop.disabled = true;
  }
}

// ── XML Check ─────────────────────────────────────────────────────────────────
function checkXML() {
  const pathInput = document.getElementById("xml-path");
  const rawPath = pathInput.value.trim();
  const path = rawPath.replace(/^["']|["']$/g, "").replace(/"/g, "").replace(/'/g, "");

  if (!path) {
    document.getElementById("file-name").textContent = "-";
    document.getElementById("entry-count").textContent = "-";
    xmlReady = false;
    return;
  }

  fetch(BASE + "/api/xml_info", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ xml_path: path })
  })
  .then(r => r.json())
  .then(d => {
    if (d.ok) {
      xmlReady = true;
      currentPath = path;
      const fname = path.split('\\').pop().split('/').pop();
      document.getElementById("file-name").textContent = fname;
      document.getElementById("entry-count").textContent = d.count;
      appendLog(t().xmlOk(d.count, fname));
    } else {
      xmlReady = false;
      document.getElementById("entry-count").textContent = "ERROR";
      appendLog(t().xmlError(d.error));
    }
  })
  .catch(e => { appendLog(t().xmlError(e)); });
}

// ── Actions ───────────────────────────────────────────────────────────────────
function startTranslation() {
  const pathInput = document.getElementById("xml-path");
  const path = pathInput.value.trim().replace(/^["']|["']$/g, "").replace(/"/g, "").replace(/'/g, "");
  if (!path) { appendLog(t().needPath); return; }

  document.getElementById("btn-start").disabled = true;
  appendLog(t().jobSent(path));

  fetch(BASE + "/api/translate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ xml_path: path })
  })
  .then(r => r.json())
  .then(d => {
    if (!d.ok) appendLog(t().xmlError(d.error));
  })
  .catch(e => appendLog(t().xmlError(e)));
}

function stopTranslation() {
  fetch(BASE + "/api/stop", { method: "POST" })
    .then(r => r.json())
    .then(d => { if (d.ok) appendLog(t().stopped); });
}

// ── Log ───────────────────────────────────────────────────────────────────────
function appendLog(text) {
  const log = document.getElementById("log");
  const ts = new Date().toLocaleTimeString();
  log.textContent += `[${ts}] ${text}\n`;
  log.scrollTop = log.scrollHeight;
}
</script>
</body>
</html>
