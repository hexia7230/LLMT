<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>LLM-Translator</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "MS UI Gothic", "MS Gothic", "Yu Gothic", Meiryo, monospace;
  font-size: 13px;
  background: #1e1e1e;
  color: #d4d4d4;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 32px 16px;
}

#app {
  width: 560px;
  max-width: 100%;
}

h1 {
  font-size: 16px;
  font-weight: bold;
  letter-spacing: 2px;
  border-bottom: 1px solid #444;
  padding-bottom: 8px;
  margin-bottom: 24px;
  color: #c8c8c8;
}

.section {
  margin-bottom: 20px;
}

label {
  display: block;
  margin-bottom: 4px;
  color: #9e9e9e;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

input[type="text"] {
  width: 100%;
  padding: 8px 12px;
  background: #252526;
  border: 1px solid #3c3c3c;
  color: #fff;
  font-family: monospace;
  font-size: 12px;
  border-radius: 2px;
  outline: none;
}
input[type="text"]:focus {
  border-color: #007acc;
}

.grid-info {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  background: #252526;
  padding: 12px;
  border: 1px solid #2d2d2d;
  margin-bottom: 20px;
}
.info-item {
  display: flex;
  flex-direction: column;
}
.info-label {
  font-size: 10px;
  color: #858585;
  margin-bottom: 2px;
}
.info-val {
  font-size: 14px;
  font-family: monospace;
  font-weight: bold;
}

.status-box {
  background: #2d2d2d;
  border-left: 4px solid #007acc;
  padding: 12px;
  font-size: 13px;
  margin-bottom: 24px;
  min-height: 44px;
  display: flex;
  align-items: center;
}

.actions {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
}

button {
  flex: 1;
  padding: 10px;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  border: none;
  border-radius: 2px;
  transition: background 0.2s;
}

#btn-start { background: #0e639c; color: #fff; }
#btn-start:hover:not(:disabled) { background: #1177bb; }
#btn-start:disabled { background: #3c3c3c; color: #777; cursor: not-allowed; }

#btn-stop { background: #a61c1c; color: #fff; }
#btn-stop:hover:not(:disabled) { background: #cd2323; }
#btn-stop:disabled { background: #3c3c3c; color: #777; cursor: not-allowed; }

.log-container {
  width: 100%;
}
textarea {
  width: 100%;
  height: 220px;
  background: #1e1e1e;
  border: 1px solid #3c3c3c;
  color: #859900;
  font-family: monospace;
  font-size: 12px;
  padding: 12px;
  resize: vertical;
  outline: none;
}
</style>
</head>
<body>

<div id="app">
  <h1>LLM-TRANSLATOR v1.0</h1>
  
  <div class="section">
    <label for="xml-path">SST XML File Path</label>
    <input type="text" id="xml-path" placeholder="C:\path\to\your\file.xml" oninput="cleanInputPath(this)" onblur="cleanInputPath(this)">
  </div>

  <div class="grid-info">
    <div class="info-item">
      <div class="info-label">File Name</div>
      <div id="file-name" class="info-val">-</div>
    </div>
    <div class="info-item">
      <div class="info-label">Target Strings</div>
      <div id="entry-count" class="info-val">-</div>
    </div>
  </div>

  <div id="status-display" class="status-box">
    状態: 待機中
  </div>

  <div class="actions">
    <button id="btn-start" onclick="startTranslation()" disabled>START</button>
    <button id="btn-stop" onclick="stopTranslation()" disabled>STOP</button>
  </div>

  <div class="log-container">
    <label>Console Log</label>
    <textarea id="log" readonly></textarea>
  </div>
</div>

<script>
const BASE = window.location.origin;
let xmlReady = false;
let currentPath = "";

// フロントエンド側で入力された瞬間にクォーテーションを完全自動消去する
function cleanInputPath(inputEl) {
  let p = inputEl.value;
  let cleaned = p.trim().replace(/^["']|["']$/g, "").replace(/"/g, "").replace(/'/g, "");
  if (p !== cleaned) {
    inputEl.value = cleaned;
  }
}

document.addEventListener("DOMContentLoaded", () => {
  const pathInput = document.getElementById("xml-path");
  
  // パス入力監視
  let timer;
  pathInput.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      checkXML();
    }, 500);
  });

  // 定期ステータス取得ループ
  setInterval(pollStatus, 800);
  pollStatus();
});

function pollStatus() {
  fetch(BASE + "/api/status")
    .then(r => r.json())
    .then(s => updateUI(s))
    .catch(e => console.error("Status polling failed:", e));
}

function updateUI(s) {
  const display = document.getElementById("status-display");
  const btnStart = document.getElementById("btn-start");
  const btnStop = document.getElementById("btn-stop");

  let pct = 0;
  if (s.total > 0) {
    pct = Math.round((s.progress / s.total) * 100);
  }

  if (s.status === "loading") {
    display.textContent = `状態: ${s.message} (${s.progress}/${s.total} - ${pct}% | 残り ${s.eta || "--"})`;
    display.style.borderLeftColor = "#f1c40f";
    btnStart.disabled = true;
    btnStop.disabled = false;
  } else if (s.status === "translating") {
    display.textContent = `状態: ${s.message} (${s.progress}/${s.total} - ${pct}% | 残り ${s.eta || "--"})`;
    display.style.borderLeftColor = "#3498db";
    btnStart.disabled = true;
    btnStop.disabled = false;
  } else if (s.status === "done") {
    display.textContent = `状態: ${s.message}`;
    display.style.borderLeftColor = "#2ecc71";
    btnStart.disabled = !xmlReady;
    btnStop.disabled = true;
  } else {
    display.textContent = `状態: ${s.message}`;
    display.style.borderLeftColor = "#e74c3c";
    btnStart.disabled = !xmlReady;
    btnStop.disabled = true;
  }
}

function checkXML() {
  const pathInput = document.getElementById("xml-path");
  const rawPath = pathInput.value.trim();
  const path = rawPath.replace(/^["']|["']$/g, "").replace(/"/g, "").replace(/'/g, "");
  
  if (!path) {
    document.getElementById("file-name").textContent = "-";
    document.getElementById("entry-count").textContent = "-";
    xmlReady = false;
    return;
  }

  fetch(BASE + "/api/xml_info", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ xml_path: path })
  })
  .then(r => r.json())
  .then(d => {
    if (d.ok) {
      xmlReady = true;
      currentPath = path;
      const fname = path.split('\\').pop().split('/').pop();
      document.getElementById("file-name").textContent = fname;
      document.getElementById("entry-count").textContent = d.count;
      appendLog("XML確認OK: " + d.count + " エントリー (" + fname + ")");
    } else {
      xmlReady = false;
      document.getElementById("entry-count").textContent = "エラー";
      appendLog("ERROR: " + d.error);
    }
  })
  .catch(e => { appendLog("ERROR: " + e); });
}

function startTranslation() {
  const pathInput = document.getElementById("xml-path");
  const path = pathInput.value.trim().replace(/^["']|["']$/g, "").replace(/"/g, "").replace(/'/g, "");
  if (!path) { appendLog("XMLパスを指定してください"); return; }

  document.getElementById("btn-start").disabled = true;
  appendLog("翻訳ジョブを送信しました: " + path);

  fetch(BASE + "/api/translate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ xml_path: path })
  })
  .then(r => r.json())
  .then(d => {
    if (!d.ok) appendLog("ERROR: " + d.error);
  })
  .catch(e => appendLog("ERROR: " + e));
}

function stopTranslation() {
  fetch(BASE + "/api/stop", { method: "POST" })
    .then(r => r.json())
    .then(d => { if (d.ok) appendLog("翻訳を強制停止しました。"); });
}

function appendLog(text) {
  const log = document.getElementById("log");
  const ts = new Date().toLocaleTimeString();
  log.textContent += `[${ts}] ${text}\n`;
  log.scrollTop = log.scrollHeight;
}
</script>
</body>
</html>
